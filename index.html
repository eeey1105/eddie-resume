/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(6,22,17,.62);opacity:0;pointer-events:none;transition:opacity .28s;z-index:60;}

/* ---------- motion ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

function openModal(kicker,title,node){
  moKicker.textContent=kicker;moTitle.textContent=title;
  moBody.innerHTML='';moBody.appendChild(node);
  modal.classList.add('on');mask.classList.add('on');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  moBody.scrollTop=0;moClose.focus();
}
function closeModal(){
  modal.classList.remove('on');mask.classList.remove('on');
  modal.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  if(lastFocus)lastFocus.focus();
}
function openItem(k,i){
  var wrap=el('div');
  if(k==='exp'){
    wrap.appendChild(blockExp(EXP[i]));
    var nav=el('div','mo-nav');
    var pv=el('button','','← 上一段：'+(EXP[i-1]?EXP[i-1].co:'')),nx=el('button','','下一段：'+(EXP[i+1]?EXP[i+1].co:'')+' →');
    if(i===0){pv.disabled=true;pv.textContent='← 已是第一段';}
    if(i===EXP.length-1){nx.disabled=true;nx.textContent='已是最后一段 →';}
    pv.onclick=function(){openItem('exp',i-1);};
    nx.onclick=function(){openItem('exp',i+1);};
    nav.appendChild(pv);nav.appendChild(nx);wrap.appendChild(nav);
    openModal('EXPERIENCE · 0'+(i+1),EXP[i].co,wrap);
  }else if(k==='cap'){
    wrap.appendChild(blockCap(CAP[i]));
    openModal('CAPABILITY · 0'+(i+1),CAP[i].t,wrap);
  }else if(k==='vibe'){
    wrap.appendChild(blockVibe(VIBE[i]));
    openModal('VIBE CODING · 0'+(i+1),VIBE[i].t,wrap);
  }else if(k==='vibeadd'){
    var b=el('div','blk');
    b.innerHTML='<div class="blk-h">如何添加新案例</div><ul>'+
      '<li>准备三项内容：案例名称、一句话说明（解决什么问题）、背景 / 做法 / 结果三段文字，配一张截图更佳。</li>'+
      '<li>把内容发给我（或直接在对话里描述），我会在 Vibe Coding 模块里新增一张卡片，并接入展开详情。</li>'+
      '<li>推荐结构：<b>背景痛点 → AI 实现过程 → 业务结果</b>，能量化的尽量量化（节省工时、覆盖率、使用率）。</li></ul>'+
      '<div class="note"><p>占位卡片已预留，随时可替换成你的真实案例。</p></div>';
    wrap.appendChild(b);
    openModal('VIBE CODING','添加案例',wrap);
  }
}
function openAll(k){
  var wrap=el('div');
  var sep=function(b,i){if(i>0){b.style.marginTop='26px';b.style.paddingTop='22px';b.style.borderTop='1px solid #E1E9E3';}};
  if(k==='exp'){
    EXP.forEach(function(e,i){var b=blockExp(e);sep(b,i);wrap.appendChild(b);});
    openModal('EXPERIENCE · ALL','职业经历（全部 6 段）',wrap);
  }else if(k==='cap'){
    CAP.forEach(function(c,i){var b=blockCap(c);sep(b,i);wrap.appendChild(b);});
    openModal('CAPABILITY · ALL','核心能力（全部 4 项）',wrap);
  }else if(k==='vibe'){
    VIBE.forEach(function(v,i){var b=blockVibe(v);sep(b,i);wrap.appendChild(b);});
    openModal('VIBE CODING · ALL','案例库（全部 '+VIBE.length+' 个）',wrap);
  }
}
document.addEventListener('click',function(ev){
  var it=ev.target.closest?ev.target.closest('[data-k]'):null;
  if(it){lastFocus=it;openItem(it.dataset.k,parseInt(it.dataset.i,10));return;}
  var al=ev.target.closest?ev.target.closest('[data-all]'):null;
  if(al){lastFocus=al;openAll(al.dataset.all);}
});
mask.addEventListener('click',closeModal);
moClose.addEventListener('click',closeModal);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal.classList.contains('on'))closeModal();});

/* 主标题为绝对定位层，右侧内容按标题实测高度让位 */
var hl=document.querySelector('.headline'),ct=document.querySelector('.content');
function syncPad(){
  if(!hl||!ct)return;
  if(window.innerWidth>1080){ct.style.paddingTop=(hl.offsetHeight+22)+'px';}
  else{ct.style.paddingTop='';}
}
window.addEventListener('resize',syncPad);
window.addEventListener('load',syncPad);
syncPad();

/* ================= 入场与数字动效 ================= */
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce){
  var seq=[document.querySelector('.photo'),document.querySelector('.headline'),document.querySelector('.content')];
  seq.forEach(function(n,i){if(n){n.classList.add('anim');n.style.animationDelay=(i*110)+'ms';}});
}
function countUp(){
  [].slice.call(document.querySelectorAll('.cu')).forEach(function(n){
    var to=parseInt(n.dataset.to,10);
    if(reduce||!to){n.textContent=to;return;}
    var dur=1100,t0=null;n.textContent='0';
    function step(t){
      if(t0===null)t0=t;
      var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
      n.textContent=Math.round(to*e);
      if(k<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
setTimeout(countUp,420);
